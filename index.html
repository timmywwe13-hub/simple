<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cottage Creek Fishing</title>
	<meta http-equiv="refresh" content="0; url=build/web/">
	<link rel="canonical" href="build/web/">
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: grid;
			place-items: center;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			background: radial-gradient(circle at 50% 20%, #263d5c 0%, #14203b 55%, #0b1320 100%);
			color: #f6ead8;
			text-align: center;
			padding: 24px;
		}
		main { max-width: 560px; }
		h1 { margin: 0 0 10px; color: #f2c14e; font-size: clamp(28px, 6vw, 46px); letter-spacing: 1px; }
		p { margin: 0 0 24px; color: #c8d6e2; line-height: 1.6; }
		a {
			display: inline-block;
			padding: 14px 28px;
			border: 3px solid #f6ead8;
			background: #68a35c;
			color: #102018;
			font-weight: 700;
			text-decoration: none;
			letter-spacing: 1px;
		}
		a:hover, a:focus { background: #8fd9a8; }
		small { display: block; margin-top: 18px; color: #7f97a8; }
	</style>
</head>
<body>
	<main>
		<h1>COTTAGE CREEK FISHING</h1>
		<p>Loading the game&hellip; If it does not start automatically, use the button below.</p>
		<a href="build/web/">PLAY THE GAME</a>
		<small><a href="README.md" style="all: unset; color: #9fb3bd; text-decoration: underline; cursor: pointer;">Read the README</a></small>
	</main>
	<script>
		window.location.replace("build/web/");
	</script>
</body>
</html>
